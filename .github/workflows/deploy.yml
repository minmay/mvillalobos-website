name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx ng build --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Sync all assets with long cache (1 year)
          # Note: Angular build puts files in dist/mvillalobos-website/browser (for newer versions)
          # or dist/mvillalobos-website. Checking angular.json: outputPath is dist/mvillalobos-website.
          # However, newer Angular versions (Application builder) often add a /browser subfolder.
          # Let's check the actual build output directory if it exists.

          BUILD_DIR="dist/mvillalobos-website"
          if [ -d "$BUILD_DIR/browser" ]; then
            BUILD_DIR="$BUILD_DIR/browser"
          fi

          echo "Uploading from $BUILD_DIR"

          # 1. Upload everything except index.html with long cache
          aws s3 sync $BUILD_DIR s3://mvillalobos.kineteque.com \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000, public"

          # 2. Upload index.html with no-cache
          aws s3 cp $BUILD_DIR/index.html s3://mvillalobos.kineteque.com/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
