name: Marco A. Villalobos
introduction: This resume is my own code. Hands-on Software Architect and Principal Software Engineer with deep
  expertise in distributed systems, data architecture, and stream processing. Brings strong experience in Java, Apache
  Flink, and cloud-native platforms, with a track record of designing and delivering scalable, real-time data systems.
  Proven as a leader, mentor, and active contributor to engineering communities. Experience spans ad tech, AI platforms,
  and large-scale data systems, with a consistent focus on architecture, concurrency, high-performance distributed
  systems, and data-intensive applications.
objective:
  - Seeking roles as Software Architect, Data Architect, or Principal Engineer (Full-Time or Corp-to-Corp). Open to remote.
